<!DOCTYPE html>
<html lang="it">

            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        .back-link { color: #58a6ff; text-decoration: none; font-size: 0.95rem; }

            color: #ffffff;
            font-size: 0.95rem;

        }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; }

        .tags-container { display: flex; gap: 8px; flex-wrap: wrap; }

        .tag-btn {
            background-color: #21262d;

            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn.active, .tag-btn:hover { background-color: #58a6ff; color: #ffffff; border-color: #58a6ff; }

            border: 1px solid #1f6feb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
        }

        #creator-panel h3 { margin-bottom: 14px; color: #58a6ff; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #c9d1d9; }

            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2ea043; }
