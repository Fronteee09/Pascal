<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal grafici</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <!-- Chart.js per i grafici -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        h1 { font-size: 1.8rem; color: #ffffff; }

        .nav-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 15px;
        }
        .nav-links a:hover { text-decoration: underline; }

        /* Filtri e Tag */
        .tags-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tag-btn.active {
            background-color: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }

        /* Form Creazione Post & Sondaggi */
        #create-post-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none; /* Visibile solo agli Admin autorizzati */
        }

        #create-post-box h3 { margin-bottom: 12px; font-size: 1.1rem; color: #58a6ff; }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #c9d1d9; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #58a6ff; }

        /* Righe dinamiche */
        .item-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .item-row input[type="text"] { flex: 2; }
        .item-row input[type="number"] { flex: 1; }
        .item-row input[type="color"] {
            width: 40px;
            height: 40px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            padding: 2px;
        }

        button.btn-small {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        button.btn-small:hover { background-color: #30363d; }

        button.btn-main {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        button.btn-main:hover { background-color: #2ea043; }

        /* Feed Post & Sondaggi */
        .post-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .post-title { font-size: 1.2rem; font-weight: bold; color: #ffffff; }
        .post-tag {
            background-color: #21262d;
            color: #58a6ff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .post-desc { color: #8b949e; font-size: 0.95rem; margin-bottom: 14px; line-height: 1.4; }

        .chart-wrapper {
            position: relative;
            max-height: 260px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }

        /* Pulsanti di voto per i sondaggi */
        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }
        .poll-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .poll-btn:hover { background-color: #30363d; border-color: #58a6ff; }
        .poll-voted { border-color: #238636; background-color: rgba(35, 134, 54, 0.1); }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #21262d;
            padding-top: 10px;
            margin-top: 10px;
        }

        /* Nota Copyright elegante ed evidente */
        .copyright-notice {
            font-size: 0.75rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.2px;
        }
        .copyright-notice span {
            color: #58a6ff;
            font-weight: 500;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid #da3633;
            color: #f85149;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .delete-btn:hover { background-color: #da3633; color: #ffffff; }

        .status-msg { text-align: center; font-size: 0.9rem; margin-top: 10px; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pascal team</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="account.html">Account</a>
            </div>
        </header>

        <!-- Form Pubblicazione (Riservato agli Admin) -->
        <div id="create-post-box">
            <h3>Crea Post, Grafico o Sondaggio (Amministratore)</h3>
            <div class="input-group">
                <label>Titolo / Domanda</label>
                <input type="text" id="post-title" placeholder="Es. Qual è il tuo passatempo preferito?">
            </div>
            <div class="input-group">
                <label>Tag</label>
                <select id="post-tag">
                    <option value="Notizie">Notizie</option>
                    <option value="Economia">Economia</option>
                    <option value="Informatica">Informatica</option>
                    <option value="Sicurezza">Sicurezza</option>
                    <option value="Sicurezza digitale">Sicurezza digitale</option>
                    <option value="Benessere">Benessere</option>
                    <option value="Divertimento">Divertimento</option>
                </select>
            </div>
            <div class="input-group">
                <label>Descrizione / Dettagli</label>
                <textarea id="post-desc" rows="2" placeholder="Scrivi una breve descrizione..."></textarea>
            </div>

            <div class="input-group">
                <label>Tipo di Contenuto</label>
                <select id="content-type">
                    <option value="bar">Grafico a Barre</option>
                    <option value="line">Grafico a Linee / Cartesiano</option>
                    <option value="pie">Grafico a Torta</option>
                    <option value="table">Tabella Dati</option>
                    <option value="poll">Sondaggio Interattivo (con Grafico a Torta)</option>
                    <option value="text">Solo Testo</option>
                </select>
            </div>

            <!-- Sezione Riquadri Dinamici -->
            <div id="builder-section" style="border-top: 1px dashed #30363d; padding-top: 12px; margin-top: 12px;">
                <label id="builder-label" style="margin-bottom: 8px; color: #58a6ff; font-weight: bold;">Configura Elementi e Colori:</label>
                <div id="items-container"></div>
                <button type="button" id="add-item-btn" class="btn-small">+ Aggiungi Elemento / Opzione</button>
            </div>

            <button id="publish-btn" class="btn-main">Pubblica</button>
            <p id="publish-status" class="status-msg"></p>
        </div>

        <!-- Filtri Tag -->
        <div class="tags-bar">
            <button class="tag-btn active" data-tag="tutti">Tutti</button>
            <button class="tag-btn" data-tag="Notizie">Notizie</button>
            <button class="tag-btn" data-tag="Economia">Economia</button>
            <button class="tag-btn" data-tag="Informatica">Informatica</button>
            <button class="tag-btn" data-tag="Sicurezza">Sicurezza</button>
            <button class="tag-btn" data-tag="Sicurezza digitale">Sicurezza digitale</button>
            <button class="tag-btn" data-tag="Benessere">Benessere</button>
            <button class="tag-btn" data-tag="Divertimento">Divertimento</button>
        </div>

        <!-- Feed -->
        <div id="posts-feed">
            <p style="text-align:center; color:#8b949e; padding: 20px;">Caricamento post in corso...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            deleteDoc,
            doc, 
            updateDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiTdOYbEMcxcFECQcl6aJWTZaei4lmQ3E",
            authDomain: "pascal-b0d51.firebaseapp.com",
            projectId: "pascal-b0d51",
            storageBucket: "pascal-b0d51.firebasestorage.app",
            messagingSenderId: "216010606072",
            appId: "1:216010606072:web:faeecf8f2f806ce9c3820d",
            measurementId: "G-SCN8C392NJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Lista degli UID autorizzati (Admin)
        const ADMIN_UIDS = [
            "RDazAVYByPNOQWKLNBSeLNittRn1",
            "xkjwFZGHbxg9DsOV0eoPqU0BrV82"
        ];

        function isAdmin(user) {
            return user && ADMIN_UIDS.includes(user.uid);
        }

        let allPosts = [];
        let activeTagFilter = 'tutti';
        let currentUser = null;

        const postsFeed = document.getElementById('posts-feed');
        const createPostBox = document.getElementById('create-post-box');
        const itemsContainer = document.getElementById('items-container');
        const contentTypeSelect = document.getElementById('content-type');
        const addItemBtn = document.getElementById('add-item-btn');

        function toggleFormMode() {
            const type = contentTypeSelect.value;
            const builder = document.getElementById('builder-section');
            if (type === 'text') {
                builder.style.display = 'none';
            } else {
                builder.style.display = 'block';
            }
        }

        contentTypeSelect.addEventListener('change', toggleFormMode);

        function addItemRow(name = '', value = '10', color = '#58a6ff') {
            const type = contentTypeSelect.value;
            const row = document.createElement('div');
            row.className = 'item-row';
            
            if (type === 'poll') {
                row.innerHTML = `
                    <input type="text" placeholder="Nome Opzione" value="${name}" class="row-name">
                    <input type="color" value="${color}" class="row-color">
                    <button type="button" class="remove-row-btn" style="background:none; border:none; color:#f85149; cursor:pointer; font-weight:bold; padding:4px 8px;">✕</button>
                `;
            } else {
                row.innerHTML = `
                    <input type="text" placeholder="Nome elemento" value="${name}" class="row-name">
                    <input type="number" placeholder="Valore" value="${value}" class="row-val">
                    <input type="color" value="${color}" class="row-color">
                    <button type="button" class="remove-row-btn" style="background:none; border:none; color:#f85149; cursor:pointer; font-weight:bold; padding:4px 8px;">✕</button>
                `;
            }
            
            row.querySelector('.remove-row-btn').addEventListener('click', () => {
                row.remove();
            });

            itemsContainer.appendChild(row);
        }

        addItemBtn.addEventListener('click', () => {
            addItemRow('Opzione', '10', '#58a6ff');
        });

        // Righe iniziali di default
        addItemRow('Opzione A', '10', '#238636');
        addItemRow('Opzione B', '20', '#58a6ff');

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (isAdmin(user)) {
                createPostBox.style.display = 'block';
            } else {
                createPostBox.style.display = 'none';
            }
            loadPosts();
        });

        async function loadPosts() {
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                allPosts = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allPosts.push({
                        id: docSnap.id,
                        title: data.title || "Senza titolo",
                        desc: data.desc || "",
                        tag: data.tag || "Notizie",
                        chartData: data.chartData || null,
                        pollData: data.pollData || null,
                        authorUid: data.authorUid || ""
                    });
                });
                renderPosts();
            } catch (err) {
                console.error("Errore caricamento:", err);
                postsFeed.innerHTML = `<p style="text-align:center; color:#f85149;">Errore nel caricamento dei post.</p>`;
            }
        }

        window.renderPosts = function() {
            const filtered = allPosts.filter(post => {
                const tag = post.tag || "Notizie";
                return activeTagFilter === 'tutti' || tag.toLowerCase() === activeTagFilter.toLowerCase();
            });

            if (filtered.length === 0) {
                postsFeed.innerHTML = `<p style="text-align:center; color:#8b949e; padding: 20px;">Nessun post trovato.</p>`;
                return;
            }

            let html = '';
            filtered.forEach(post => {
                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <span class="post-title">${escapeHtml(post.title)}</span>
                            <span class="post-tag">${escapeHtml(post.tag)}</span>
                        </div>
                        <p class="post-desc">${escapeHtml(post.desc)}</p>
                `;

                if (post.pollData) {
                    const totalVotes = post.pollData.options.reduce((acc, opt) => acc + (opt.votes ? opt.votes.length : 0), 0);
                    
                    html += `<div class="chart-wrapper"><canvas id="poll-chart-${post.id}"></canvas></div>`;
                    html += `<div style="text-align:center; font-size:0.85rem; color:#8b949e; margin-bottom:10px;">Partecipanti totali: ${totalVotes}</div>`;
                    
                    html += `<div class="poll-options">`;
                    post.pollData.options.forEach((opt, idx) => {
                        const hasVotedThis = currentUser && opt.votes && opt.votes.includes(currentUser.uid);
                        html += `
                            <button class="poll-btn ${hasVotedThis ? 'poll-voted' : ''}" onclick="window.votePollAction('${post.id}', ${idx})">
                                <span>${escapeHtml(opt.name)}</span>
                                <span style="font-weight:bold; color:#58a6ff;">${opt.votes ? opt.votes.length : 0} voti</span>
                            </button>
                        `;
                    });
                    html += `</div>`;
                }
                else if (post.chartData && post.chartData.type === 'table') {
                    html += `<table style="width:100%; border-collapse: collapse; margin-bottom: 14px; font-size:0.9rem;">
                        <tr style="border-bottom: 1px solid #30363d; text-align: left;"><th style="padding:6px;">Elemento</th><th style="padding:6px;">Valore</th></tr>`;
                    if (post.chartData.labels && post.chartData.datasets) {
                        post.chartData.labels.forEach((lbl, idx) => {
                            html += `<tr style="border-bottom: 1px solid #21262d;"><td style="padding:6px;">${escapeHtml(lbl)}</td><td style="padding:6px;">${post.chartData.datasets[0].data[idx]}</td></tr>`;
                        });
                    }
                    html += `</table>`;
                } 
                else if (post.chartData && post.chartData.type) {
                    html += `<div class="chart-wrapper"><canvas id="chart-${post.id}"></canvas></div>`;
                }

                // Footer con nota Copyright evidente ma non invadente e pulsante elimina
                html += `
                    <div class="post-footer">
                        <div class="copyright-notice">
                            🔒 <span>© 2026 Pascal team</span> — Tutti i diritti riservati. Protetto da copyright.
                        </div>
                `;
                if (isAdmin(currentUser)) {
                    html += `<button class="delete-btn" onclick="window.deletePostAction('${post.id}')">Elimina</button>`;
                }
                html += `</div></div>`;
            });

            postsFeed.innerHTML = html;

            filtered.forEach(post => {
                if (post.pollData) {
                    const ctx = document.getElementById(`poll-chart-${post.id}`);
                    if (ctx) {
                        const labels = post.pollData.options.map(o => o.name);
                        const data = post.pollData.options.map(o => o.votes ? o.votes.length : 0);
                        const colors = post.pollData.options.map(o => o.color);

                        try {
                            new Chart(ctx, {
                                type: 'pie',
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        data: data,
                                        backgroundColor: colors,
                                        borderColor: '#30363d',
                                        borderWidth: 1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: {
                                        legend: { labels: { color: '#e6edf3' } },
                                        tooltip: {
                                            callbacks: {
                                                label: function(context) {
                                                    const label = context.label || '';
                                                    const value = context.raw || 0;
                                                    const dataset = context.dataset.data;
                                                    const total = dataset.reduce((acc, val) => acc + val, 0);
                                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                                    return `${label}: ${value} voti (${percentage}%)`;
                                                }
                                            }
                                        }
                                    }
                                }
                            });
                        } catch (e) {
                            console.error("Errore rendering sondaggio:", e);
                        }
                    }
                } 
                else if (post.chartData && post.chartData.type && post.chartData.type !== 'table') {
                    const ctx = document.getElementById(`chart-${post.id}`);
                    if (ctx) {
                        try {
                            new Chart(ctx, {
                                type: post.chartData.type,
                                data: post.chartData,
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: {
                                        legend: { labels: { color: '#e6edf3' } },
                                        tooltip: {
                                            callbacks: {
                                                label: function(context) {
                                                    const label = context.label || '';
                                                    const value = context.raw || 0;
                                                    if (post.chartData.type === 'pie') {
                                                        const dataset = context.dataset.data;
                                                        const total = dataset.reduce((acc, val) => acc + val, 0);
                                                        const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                                        return `${label}: ${value} (${percentage}%)`;
                                                    }
                                                    return `${label}: ${value}`;
                                                }
                                            }
                                        }
                                    },
                                    scales: post.chartData.type !== 'pie' ? {
                                        x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                                        y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
                                    } : {}
                                }
                            });
                        } catch (e) {
                            console.error("Errore rendering grafico:", e);
                        }
                    }
                }
            });
        };

        window.votePollAction = async function(postId, optionIndex) {
            if (!currentUser) {
                alert("Devi effettuare l'accesso per votare.");
                return;
            }

            const postRef = doc(db, "posts", postId);
            const post = allPosts.find(p => p.id === postId);
            if (!post || !post.pollData) return;

            let options = JSON.parse(JSON.stringify(post.pollData.options));

            options.forEach(opt => {
                if (opt.votes) {
                    opt.votes = opt.votes.filter(uid => uid !== currentUser.uid);
                }
            });

            if (!options[optionIndex].votes) options[optionIndex].votes = [];
            options[optionIndex].votes.push(currentUser.uid);

            try {
                await updateDoc(postRef, { "pollData.options": options });
                post.pollData.options = options;
                renderPosts();
            } catch (err) {
                console.error("Errore voto sondaggio:", err);
                alert("Impossibile registrare il voto.");
            }
        };

        window.deletePostAction = async function(postId) {
            if (!isAdmin(currentUser)) return;
            if (!confirm("Sei sicuro di voler eliminare questo post?")) return;

            try {
                await deleteDoc(doc(db, "posts", postId));
                allPosts = allPosts.filter(p => p.id !== postId);
                renderPosts();
            } catch (err) {
                alert("Errore durante l'eliminazione: " + err.message);
            }
        };

        document.getElementById('publish-btn').addEventListener('click', async () => {
            if (!isAdmin(currentUser)) {
                alert("Non sei autorizzato a pubblicare.");
                return;
            }

            const titleVal = document.getElementById('post-title').value.trim();
            const tagVal = document.getElementById('post-tag').value;
            const descVal = document.getElementById('post-desc').value.trim();
            const contentType = contentTypeSelect.value;
            const statusEl = document.getElementById('publish-status');

            if (!titleVal) {
                statusEl.textContent = "Inserisci un titolo o una domanda valida.";
                statusEl.className = "status-msg error";
                return;
            }

            let chartDataObj = null;
            let pollDataObj = null;

            if (contentType === 'poll') {
                const rows = document.querySelectorAll('.item-row');
                const pollOptions = [];
                rows.forEach(row => {
                    const name = row.querySelector('.row-name').value.trim() || 'Opzione';
                    const col = row.querySelector('.row-color').value;
                    pollOptions.push({ name: name, color: col, votes: [] });
                });

                if (pollOptions.length < 2) {
                    statusEl.textContent = "Un sondaggio deve avere almeno 2 opzioni.";
                    statusEl.className = "status-msg error";
                    return;
                }

                pollDataObj = { options: pollOptions };
            } 
            else if (contentType !== 'text') {
                const rows = document.querySelectorAll('.item-row');
                const labels = [];
                const data = [];
                const colors = [];

                rows.forEach(row => {
                    const name = row.querySelector('.row-name').value.trim() || 'Elemento';
                    const val = parseFloat(row.querySelector('.row-val').value) || 0;
                    const col = row.querySelector('.row-color').value;

                    labels.push(name);
                    data.push(val);
                    colors.push(col);
                });

                chartDataObj = {
                    type: contentType,
                    labels: labels,
                    datasets: [{
                        label: titleVal,
                        data: data,
                        backgroundColor: contentType === 'line' ? 'rgba(88, 166, 255, 0.2)' : colors,
                        borderColor: contentType === 'line' ? (colors[0] || '#58a6ff') : '#30363d',
                        borderWidth: 2,
                        fill: contentType === 'line' ? true : false,
                        tension: 0.2
                    }]
                };
            }

            try {
                statusEl.textContent = "Pubblicazione in corso...";
                statusEl.className = "status-msg";

                await addDoc(collection(db, "posts"), {
                    title: titleVal,
                    tag: tagVal,
                    desc: descVal,
                    chartData: chartDataObj,
                    pollData: pollDataObj,
                    authorUid: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                document.getElementById('post-title').value = '';
                document.getElementById('post-desc').value = '';
                statusEl.textContent = "Pubblicato con successo!";
                statusEl.className = "status-msg success";

                loadPosts();
            } catch (err) {
                statusEl.textContent = "Errore: " + err.message;
                statusEl.className = "status-msg error";
            }
        });

        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeTagFilter = e.target.getAttribute('data-tag');
                renderPosts();
            });
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
