<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal - Mappe e Territorio</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <!-- Leaflet CSS per la mappa interattiva open source -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        h1 { font-size: 1.8rem; color: #ffffff; }

        .nav-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 15px;
        }
        .nav-links a:hover { text-decoration: underline; }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 { margin-bottom: 12px; font-size: 1.1rem; color: #58a6ff; }

        /* Contenitore della Mappa */
        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: 1px solid #30363d;
            z-index: 1;
        }

        .locations-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .loc-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .loc-btn:hover {
            background-color: #30363d;
            color: #ffffff;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pascal Mappe</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="grafici.html">Grafici</a>
                <a href="account.html">Account</a>
            </div>
        </header>

        <div class="card">
            <h3>Mappa Interattiva</h3>
            <p style="font-size: 0.9rem; color: #8b949e; margin-bottom: 14px;">Esplora la mappa o seleziona una delle sedi principali qui sotto per centrare la visuale.</p>
            
            <!-- Div in cui Leaflet caricherà la mappa -->
            <div id="map"></div>

            <div class="locations-list">
                <button class="loc-btn" onclick="panToLocation(45.4642, 9.1900, 'Milano - Sede Centrale', 'Sede principale di coordinamento.')">Milano</button>
                <button class="loc-btn" onclick="panToLocation(41.9028, 12.4964, 'Roma - Hub Operativo', 'Centro logistico e di controllo.')">Roma</button>
                <button class="loc-btn" onclick="panToLocation(45.0703, 7.6869, 'Torino - Sede Nord-Ovest', 'Polo tecnologico e di sviluppo.')">Torino</button>
                <button class="loc-btn" onclick="panToLocation(43.7696, 11.2558, 'Firenze - Hub Centro', 'Centro studi e documentazione.')">Firenze</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inizializzazione della mappa centrata sull'Italia
        const map = L.map('map').setView([42.5, 12.5], 6);

        // Aggiungiamo i layer delle Tile di OpenStreetMap (stile scuro pulito o standard)
        // Usiamo un tema scuro compatibile con il design di Pascal
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd'
        }).addTo(map);

        // Array di punti di interesse predefiniti
        const places = [
            { lat: 45.4642, lng: 9.1900, title: "Milano - Sede Centrale", desc: "Sede principale di coordinamento." },
            { lat: 41.9028, lng: 12.4964, title: "Roma - Hub Operativo", desc: "Centro logistico e di controllo." },
            { lat: 45.0703, lng: 7.6869, title: "Torino - Sede Nord-Ovest", desc: "Polo tecnologico e di sviluppo." },
            { lat: 43.7696, lng: 11.2558, title: "Firenze - Hub Centro", desc: "Centro studi e documentazione." }
        ];

        // Aggiungiamo i marker sulla mappa
        places.forEach(place => {
            const marker = L.marker([place.lat, place.lng]).addTo(map);
            marker.bindPopup(`<b>${place.title}</b><br>${place.desc}`);
        });

        // Funzione globale per spostare la mappa cliccando sui bottoni
        window.panToLocation = function(lat, lng, title, desc) {
            map.setView([lat, lng], 13);
            // Trova e apre il popup corrispondente se si vuole, o semplicemente sposta
        };
    </script>
</body>
</html>
