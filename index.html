<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal</title>
    <style>
        /* Reset e impostazioni base per tema scuro */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117; /* Nero/grigio scuro stile GitHub Dark */
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Box centrale */
        .main-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Logo circolare */
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
            margin-bottom: 20px;
            background-color: #0d1117; /* Sfondo di fallback se l'immagine tarda a caricare */
        }

        /* Titolo Pascal */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* Descrizione */
        .description {
            font-size: 1rem;
            line-height: 1.5;
            color: #8b949e;
        }

        /* Contenitore pulsanti sotto il box */
        .nav-buttons {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            max-width: 480px;
        }

        /* Stile dei pulsanti */
        .btn {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 14px 20px;
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid #30363d;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="main-box">
        <img src="logo.png" alt="Logo Pascal" class="logo">
        <h1>Pascal</h1>
        <p class="description">
            La tua piattaforma per esplorare dati, visualizzare informazioni e organizzare le idee in modo chiaro.
        </p>
    </div>

    <div class="nav-buttons">
        <a href="grafici.html" class="btn">Grafici</a>
        <a href="mappe.html" class="btn">Mappe</a>
    </div>

</body>
</html>
