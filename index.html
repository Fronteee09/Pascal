<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
            margin-bottom: 20px;
            background-color: #0d1117;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .description {
            font-size: 1rem;
            line-height: 1.5;
            color: #8b949e;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            max-width: 480px;
        }

        .green-buttons {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            width: 100%;
            max-width: 480px;
        }

        .btn {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 14px 20px;
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid #30363d;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Stile per i pulsanti verdi */
        .btn-green {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 14px 20px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid #2ea043;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-green:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
        }

        .account-container {
            margin-top: 16px;
            width: 100%;
            max-width: 480px;
        }

        .btn-account {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px 20px;
            background-color: #1f6feb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-account:hover {
            background-color: #388bfd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="main-box">
        <img src="logo.png" alt="Logo Pascal" class="logo">
        <h1>Pascal</h1>
        <p class="description">
            La tua piattaforma per esplorare dati, visualizzare informazioni e organizzare le idee in modo chiaro.
        </p>
    </div>

    <div class="nav-buttons">
        <a href="grafici.html" class="btn">Grafici</a>
        <a href="files.html" class="btn">Documenti</a>
    </div>

    <!-- Pulsanti verdi affiancati -->
    <div class="green-buttons">
        <a href="altro.html" class="btn-green">Altre cose</a>
        <a href="codingpage.html" class="btn-green">Coding Page</a>
    </div>

    <div class="account-container">
        <a href="account.html" class="btn-account">Account</a>
    </div>

</body>
</html>
