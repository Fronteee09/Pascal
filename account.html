
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal - Account e Notifiche</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        h1 { font-size: 1.8rem; color: #ffffff; }

        .nav-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 15px;
        }

        .nav-links a:hover { text-decoration: underline; }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #58a6ff;
        }

        .input-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus { border-color: #58a6ff; }

        button.btn-main {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        button.btn-main:hover { background-color: #2ea043; }

        button.btn-danger {
            background-color: #da3633;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button.btn-danger:hover { background-color: #f85149; }

        .status-msg {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .error { color: #f85149; }
        .success { color: #3fb950; }

        #user-info { display: none; }
        #login-section { display: none; }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Pascal Account</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="grafici.html">Grafici</a>
            </div>
        </header>

        <!-- Sezione Login e Registrazione -->

        <div id="login-section" class="card">

            <h3>Accedi</h3>

            <div class="input-group">
                <label>Nickname</label>
                <input
                    type="text"
                    id="login-nickname"
                    placeholder="Il tuo nickname"
                    maxlength="20"
                    autocomplete="username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="login-password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                >
            </div>

            <button id="login-btn" class="btn-main">
                Accedi
            </button>

            <button
                id="register-btn"
                class="btn-main"
                style="background-color: #1f6feb;"
            >
                Crea account
            </button>

            <p id="login-status" class="status-msg"></p>

        </div>

        <!-- Area Utente / Notifiche -->

        <div id="user-info" class="card">

            <h3>Area Personale</h3>

            <p
                id="user-email-display"
                style="margin-bottom: 16px; color: #8b949e; font-size: 0.95rem;"
            ></p>

            <div style="border-top: 1px solid #30363d; padding-top: 16px; margin-top: 16px;">

                <h3 style="font-size: 1rem; color: #ffffff; margin-bottom: 8px;">
                    Notifiche Push
                </h3>

                <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 12px;">
                    Attiva le notifiche per ricevere aggiornamenti in tempo reale sul tuo dispositivo.
                </p>

                <button id="notif-btn" class="btn-main">
                    🔔 Attiva Notifiche sul Telefono
                </button>

                <p id="notif-status" class="status-msg"></p>

            </div>

            <div style="border-top: 1px solid #30363d; padding-top: 16px; margin-top: 16px;">

                <button id="logout-btn" class="btn-danger">
                    Disconnetti Account
                </button>

            </div>

        </div>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getMessaging,
            getToken
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";


        // CONFIGURAZIONE FIREBASE

        const firebaseConfig = {
            apiKey: "AIzaSyBiTdOYbEMcxcFECQcl6aJWTZaei4lmQ3E",
            authDomain: "pascal-b0d51.firebaseapp.com",
            projectId: "pascal-b0d51",
            storageBucket: "pascal-b0d51.firebasestorage.app",
            messagingSenderId: "216010606072",
            appId: "1:216010606072:web:faeecf8f2f806ce9c3820d",
            measurementId: "G-SCN8C392NJ"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const messaging = getMessaging(app);


        const loginSection = document.getElementById('login-section');
        const userInfo = document.getElementById('user-info');
        const userEmailDisplay = document.getElementById('user-email-display');


        // CONVERSIONE NICKNAME IN EMAIL TECNICA

        function nicknameToEmail(nickname) {
            return "nick_" + nickname.toLowerCase() + "@pascal-b0d51.firebaseapp.com";
        }


        // GESTIONE ACCESSO UTENTE

        onAuthStateChanged(auth, (user) => {

            if (user) {

                loginSection.style.display = 'none';
                userInfo.style.display = 'block';

                const nickname = user.email
                    .replace("@pascal-b0d51.firebaseapp.com", "")
                    .replace(/^nick_/, "");

                userEmailDisplay.textContent =
                    `Accesso effettuato come: ${nickname}`;

            } else {

                loginSection.style.display = 'block';
                userInfo.style.display = 'none';

            }

        });


        // LOGIN

        document.getElementById('login-btn').addEventListener('click', async () => {

            const nickname = document.getElementById('login-nickname').value.trim();
            const password = document.getElementById('login-password').value;

            const statusEl = document.getElementById('login-status');

            if (!nickname || !password) {

                statusEl.textContent = "Inserisci nickname e password.";
                statusEl.className = "status-msg error";

                return;
            }

            if (!/^[a-zA-Z0-9_-]{3,20}$/.test(nickname)) {

                statusEl.textContent = "Nickname non valido.";
                statusEl.className = "status-msg error";

                return;
            }

            try {

                statusEl.textContent = "Accesso in corso...";
                statusEl.className = "status-msg";

                const email = nicknameToEmail(nickname);

                await signInWithEmailAndPassword(auth, email, password);

                statusEl.textContent = "";

            } catch (err) {

                statusEl.textContent = "Nickname o password errati.";
                statusEl.className = "status-msg error";

            }

        });


        // REGISTRAZIONE

        document.getElementById('register-btn').addEventListener('click', async () => {

            const nickname = document.getElementById('login-nickname').value.trim();
            const password = document.getElementById('login-password').value;

            const statusEl = document.getElementById('login-status');

            if (!nickname || !password) {

                statusEl.textContent = "Inserisci nickname e password.";
                statusEl.className = "status-msg error";

                return;
            }

            if (!/^[a-zA-Z0-9_-]{3,20}$/.test(nickname)) {

                statusEl.textContent = "Il nickname deve avere 3-20 caratteri e contenere solo lettere, numeri, _ oppure -.";
                statusEl.className = "status-msg error";

                return;
            }

            if (password.length < 6) {

                statusEl.textContent = "La password deve contenere almeno 6 caratteri.";
                statusEl.className = "status-msg error";

                return;
            }

            try {

                statusEl.textContent = "Creazione account in corso...";
                statusEl.className = "status-msg";

                const email = nicknameToEmail(nickname);

                await createUserWithEmailAndPassword(auth, email, password);

                statusEl.textContent = "Account creato con successo!";
                statusEl.className = "status-msg success";

            } catch (err) {

                let message = "Errore durante la registrazione.";

                if (err.code === "auth/email-already-in-use") {

                    message = "Questo nickname è già utilizzato.";

                } else if (err.code === "auth/weak-password") {

                    message = "Password troppo debole.";

                } else if (err.code === "auth/operation-not-allowed") {

                    message = "Registrazione non abilitata su Firebase.";

                } else if (err.code === "auth/invalid-email") {

                    message = "Nickname non valido.";

                }

                statusEl.textContent = message;
                statusEl.className = "status-msg error";

            }

        });


        // LOGOUT

        document.getElementById('logout-btn').addEventListener('click', async () => {

            try {

                await signOut(auth);

            } catch (err) {

                console.error("Errore logout:", err);

            }

        });


        // ATTIVAZIONE NOTIFICHE PUSH

        document.getElementById('notif-btn').addEventListener('click', async () => {

            const statusEl = document.getElementById('notif-status');

            if (!('serviceWorker' in navigator)) {

                statusEl.textContent = "Il tuo browser non supporta i Service Worker.";
                statusEl.className = "status-msg error";

                return;
            }

            try {

                statusEl.textContent = "Richiesta permessi in corso...";
                statusEl.className = "status-msg";

                // Rilevamento automatico percorso GitHub Pages

                const pathSegments = window.location.pathname.split('/').filter(Boolean);

                const swPath = pathSegments.length > 1
                    ? `/${pathSegments[0]}/firebase-messaging-sw.js`
                    : '/firebase-messaging-sw.js';

                const registration = await navigator.serviceWorker.register(swPath);

                const currentToken = await getToken(messaging, {

                    vapidKey: 'BGV8ajD062Rl_FC0ThkFuy6D9ieZ90FavG5dJpvebhmQgrmNlY7j4I0NfrzdAoxiEtAZvxeRh4TPfqzah6KVGw',

                    serviceWorkerRegistration: registration

                });

                if (currentToken) {

                    statusEl.textContent = "Notifiche attivate con successo!";
                    statusEl.className = "status-msg success";

                    console.log("Token FCM ottenuto:", currentToken);

                } else {

                    statusEl.textContent = "Impossibile ottenere il token di notifica.";
                    statusEl.className = "status-msg error";

                }

            } catch (err) {

                console.error("Errore notifiche:", err);

                statusEl.textContent = "Errore: " + err.message;
                statusEl.className = "status-msg error";

            }

        });

    </script>

</body>
</html>
