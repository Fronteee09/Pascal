<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal - Account e Notifiche</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        h1 { font-size: 1.8rem; color: #ffffff; }

        .nav-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 15px;
        }
        .nav-links a:hover { text-decoration: underline; }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 { margin-bottom: 12px; font-size: 1.1rem; color: #58a6ff; }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #c9d1d9; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: #58a6ff; }

        button.btn-main {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button.btn-main:hover { background-color: #2ea043; }

        button.btn-danger {
            background-color: #da3633;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button.btn-danger:hover { background-color: #f85149; }

        .status-msg { text-align: center; font-size: 0.9rem; margin-top: 10px; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
        
        #user-info { display: none; }
        #login-section { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pascal Account</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="grafici.html">Grafici</a>
            </div>
        </header>

        <!-- Sezione Login -->
        <div id="login-section" class="card">
            <h3>Accedi</h3>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="nome@esempio.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button id="login-btn" class="btn-main">Accedi</button>
            <p id="login-status" class="status-msg"></p>
        </div>

        <!-- Sezione Area Utente / Notifiche -->
        <div id="user-info" class="card">
            <h3>Area Personale</h3>
            <p id="user-email-display" style="margin-bottom: 16px; color: #8b949e; font-size: 0.95rem;"></p>
            
            <div style="border-top: 1px solid #30363d; padding-top: 16px; margin-top: 16px;">
                <h3 style="font-size: 1rem; color: #ffffff; margin-bottom: 8px;">Notifiche Push</h3>
                <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 12px;">Attiva le notifiche per ricevere aggiornamenti in tempo reale sul tuo dispositivo.</p>
                <button id="notif-btn" class="btn-main">🔔 Attiva Notifiche sul Telefono</button>
                <p id="notif-status" class="status-msg"></p>
            </div>

            <div style="border-top: 1px solid #30363d; padding-top: 16px; margin-top: 16px;">
                <button id="logout-btn" class="btn-danger">Disconnetti Account</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiTdOYbEMcxcFECQcl6aJWTZaei4lmQ3E",
            authDomain: "pascal-b0d51.firebaseapp.com",
            projectId: "pascal-b0d51",
            storageBucket: "pascal-b0d51.firebasestorage.app",
            messagingSenderId: "216010606072",
            appId: "1:216010606072:web:faeecf8f2f806ce9c3820d",
            measurementId: "G-SCN8C392NJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const messaging = getMessaging(app);

        const loginSection = document.getElementById('login-section');
        const userInfo = document.getElementById('user-info');
        const userEmailDisplay = document.getElementById('user-email-display');

        // Gestione Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                userInfo.style.display = 'block';
                userEmailDisplay.textContent = `Accesso effettuato come: ${user.email}`;
            } else {
                loginSection.style.display = 'block';
                userInfo.style.display = 'none';
            }
        });

        // Login
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const statusEl = document.getElementById('login-status');

            if (!email || !password) {
                statusEl.textContent = "Inserisci email e password.";
                statusEl.className = "status-msg error";
                return;
            }

            try {
                statusEl.textContent = "Accesso in corso...";
                statusEl.className = "status-msg";
                await signInWithEmailAndPassword(auth, email, password);
                statusEl.textContent = "";
            } catch (err) {
                statusEl.textContent = "Errore: " + err.message;
                statusEl.className = "status-msg error";
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (err) {
                console.error("Errore logout:", err);
            }
        });

        // Attivazione Notifiche Push
        document.getElementById('notif-btn').addEventListener('click', async () => {
            const statusEl = document.getElementById('notif-status');
            
            if (!('serviceWorker' in navigator)) {
                statusEl.textContent = "Il tuo browser non supporta i Service Worker.";
                statusEl.className = "status-msg error";
                return;
            }

            try {
                statusEl.textContent = "Richiesta permessi in corso...";
                statusEl.className = "status-msg";

                // Registrazione esplicita del Service Worker alla radice
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                
                const currentToken = await getToken(messaging, {
                    vapidKey: 'BGV8ajD062Rl_FC0ThkFuy6D9ieZ90FavG5dJpvebhmQgrmNlY7j4I0NfrzdAoxiEtAZvxeRh4TPfqzahK6VKGw',
                    serviceWorkerRegistration: registration
                });

                if (currentToken) {
                    statusEl.textContent = "Notifiche attivate con successo!";
                    statusEl.className = "status-msg success";
                    console.log("Token FCM ottenuto:", currentToken);
                } else {
                    statusEl.textContent = "Impossibile ottenere il token di notifica.";
                    statusEl.className = "status-msg error";
                }
            } catch (err) {
                console.error("Errore notifiche:", err);
                statusEl.textContent = "Errore: " + err.message;
                statusEl.className = "status-msg error";
            }
        });
    </script>
</body>
</html>
