<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal - Coding</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        h1 { font-size: 1.8rem; color: #ffffff; }

        .nav-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 15px;
        }
        .nav-links a:hover { text-decoration: underline; }

        /* Box Introduttivo con Barra Superiore */
        .intro-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .intro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
        }

        .intro-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .intro-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
            background-color: #0d1117;
        }

        .intro-title-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .subscribe-btn {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid #2ea043;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .subscribe-btn:hover { background-color: #2ea043; }
        .subscribe-btn.subscribed {
            background-color: #21262d;
            color: #8b949e;
            border-color: #30363d;
        }

        .intro-desc {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.5;
        }

        /* Form Pubblicazione (Admin Only) */
        #create-post-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: none;
        }

        #create-post-box h3 { margin-bottom: 12px; font-size: 1.1rem; color: #58a6ff; }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #c9d1d9; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #58a6ff; }

        button.btn-main {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        button.btn-main:hover { background-color: #2ea043; }

        /* Feed */
        .post-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .post-title { font-size: 1.2rem; font-weight: bold; color: #ffffff; }
        .post-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
            background-color: #0d1117;
        }

        .post-content { color: #c9d1d9; font-size: 0.95rem; line-height: 1.5; margin-bottom: 14px; white-space: pre-wrap; }

        /* Stile Box Codice per Script */
        .code-container {
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 14px;
            overflow: hidden;
            background-color: #0d1117;
        }

        .code-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #0d1117;
        }

        .code-body {
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e6edf3;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .copy-code-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.3);
            color: inherit;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .copy-code-btn:hover { background: rgba(0, 0, 0, 0.4); }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #21262d;
            padding-top: 10px;
        }

        .copyright-notice {
            font-size: 0.75rem;
            color: #8b949e;
        }
        .copyright-notice span { color: #58a6ff; font-weight: 500; }

        .delete-btn {
            background: transparent;
            border: 1px solid #da3633;
            color: #f85149;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .delete-btn:hover { background-color: #da3633; color: #ffffff; }

        .status-msg { text-align: center; font-size: 0.9rem; margin-top: 10px; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pascal Coding</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="altro.html">Altro</a>
                <a href="account.html">Account</a>
            </div>
        </header>

        <!-- Box Introduttivo con Barra Superiore -->
        <div class="intro-box">
            <div class="intro-header">
                <div class="intro-user-info">
                    <img src="coding.png" alt="Coding" class="intro-avatar">
                    <span class="intro-title-text">Area Sviluppo & Laboratorio</span>
                </div>
                <button id="subscribe-btn" class="subscribe-btn" onclick="toggleSubscribe()">Iscriviti</button>
            </div>
            <p class="intro-desc">
                Progetti di programmazione, snippet di codice, idee di sviluppo e laboratori pratici curati dal team.
            </p>
        </div>

        <!-- Form Pubblicazione (Riservato ai 2 Admin) -->
        <div id="create-post-box">
            <h3>Crea Progetto / Snippet (Amministratore)</h3>
            <div class="input-group">
                <label>Titolo Progetto</label>
                <input type="text" id="post-title" placeholder="Es. Funzione di utilità in JS">
            </div>
            <div class="input-group">
                <label>Link Immagine (opzionale)</label>
                <input type="text" id="post-image" placeholder="Inserisci il link dell'immagine">
            </div>
            <div class="input-group">
                <label>Linguaggio Script (per il Box Codice)</label>
                <select id="code-lang">
                    <option value="none">Nessun box codice (testo normale)</option>
                    <option value="js">JavaScript (#coding js)</option>
                    <option value="python">Python (#coding python)</option>
                    <option value="html">HTML (#coding html)</option>
                    <option value="css">CSS (#coding css)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Codice / Descrizione</label>
                <textarea id="post-text" rows="5" placeholder="Scrivi qui il codice o i dettagli..."></textarea>
            </div>
            <button id="publish-btn" class="btn-main">Pubblica</button>
            <p id="publish-status" class="status-msg"></p>
        </div>

        <!-- Feed dei Post -->
        <div id="posts-feed">
            <p style="text-align:center; color:#8b949e; padding: 20px;">Caricamento progetti...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            deleteDoc,
            doc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiTdOYbEMcxcFECQcl6aJWTZaei4lmQ3E",
            authDomain: "pascal-b0d51.firebaseapp.com",
            projectId: "pascal-b0d51",
            storageBucket: "pascal-b0d51.firebasestorage.app",
            messagingSenderId: "216010606072",
            appId: "1:216010606072:web:faeecf8f2f806ce9c3820d",
            measurementId: "G-SCN8C392NJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // I due UID autorizzati rigorosamente
        const ADMIN_UIDS = [
            "RDazAVYByPNOQWKLNBSeLNittRn1",
            "xkjwFZGHbxg9DsOV0eoPqU0BrV82"
        ];

        function isAdmin(user) {
            return user && ADMIN_UIDS.includes(user.uid);
        }

        let allPosts = [];
        let currentUser = null;

        const postsFeed = document.getElementById('posts-feed');
        const createPostBox = document.getElementById('create-post-box');

        // Gestione iscrizione (salvata in localStorage)
        let isSubscribed = localStorage.getItem('pascal_coding_subbed') === 'true';
        updateSubscribeUI();

        window.toggleSubscribe = function() {
            isSubscribed = !isSubscribed;
            localStorage.setItem('pascal_coding_subbed', isSubscribed);
            updateSubscribeUI();
        }

        function updateSubscribeUI() {
            const btn = document.getElementById('subscribe-btn');
            if (isSubscribed) {
                btn.textContent = "Iscritto ✓";
                btn.className = "subscribe-btn subscribed";
            } else {
                btn.textContent = "Iscriviti";
                btn.className = "subscribe-btn";
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (isAdmin(user)) {
                createPostBox.style.display = 'block';
            } else {
                createPostBox.style.display = 'none';
            }
            loadPosts();
        });

        async function loadPosts() {
            try {
                const querySnapshot = await getDocs(collection(db, "coding_posts"));
                allPosts = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allPosts.push({
                        id: docSnap.id,
                        title: data.title || "Senza titolo",
                        imageUrl: data.imageUrl || "",
                        text: data.text || "",
                        authorUid: data.authorUid || ""
                    });
                });
                renderPosts();
            } catch (err) {
                console.error("Errore caricamento progetti:", err);
                postsFeed.innerHTML = `<p style="text-align:center; color:#f85149;">Errore nel caricamento dei progetti.</p>`;
            }
        }

        window.renderPosts = function() {
            if (allPosts.length === 0) {
                postsFeed.innerHTML = `<p style="text-align:center; color:#8b949e; padding: 20px;">Nessun progetto disponibile al momento.</p>`;
                return;
            }

            let html = '';
            allPosts.forEach(post => {
                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <span class="post-title">${escapeHtml(post.title)}</span>
                        </div>
                `;

                if (post.imageUrl) {
                    html += `<img src="${escapeHtml(post.imageUrl)}" alt="Immagine progetto" class="post-img">`;
                }

                // Controllo se il testo inizia con #coding (es. #coding js, #coding python, ecc.)
                let rawText = post.text || '';
                let trimmedText = rawText.trim();
                
                if (trimmedText.startsWith('#coding')) {
                    let firstLineEnd = trimmedText.indexOf('\n');
                    let headerLine = firstLineEnd !== -1 ? trimmedText.substring(0, firstLineEnd) : trimmedText;
                    let codeBody = firstLineEnd !== -1 ? trimmedText.substring(firstLineEnd + 1).trim() : '';
                    
                    let parts = headerLine.split(/\s+/);
                    let lang = parts.length > 1 ? parts[1].toLowerCase() : 'code';

                    let barColor = '#30363d';
                    let langName = 'CODICE';

                    if (lang === 'js') {
                        barColor = '#d29922'; // Giallo
                        langName = 'JAVASCRIPT';
                    } else if (lang === 'python') {
                        barColor = '#58a6ff'; // Blu
                        langName = 'PYTHON';
                    } else if (lang === 'html') {
                        barColor = '#f85149'; // Rosso
                        langName = 'HTML';
                    } else if (lang === 'css') {
                        barColor = '#238636'; // Verde
                        langName = 'CSS';
                    }

                    // ID univoco per il blocco di codice per facilitare la copia
                    let codeId = 'code-block-' + Math.random().toString(36).substr(2, 9);

                    html += `
                        <div class="code-container">
                            <div class="code-header-bar" style="background-color: ${barColor};">
                                <span>${langName}</span>
                                <button class="copy-code-btn" onclick="window.copyCodeText('${codeId}')">Copia</button>
                            </div>
                            <div class="code-body" id="${codeId}">${escapeHtml(codeBody)}</div>
                        </div>
                    `;
                } else {
                    html += `<div class="post-content">${escapeHtml(rawText)}</div>`;
                }

                html += `
                        <div class="post-footer">
                            <div class="copyright-notice">
                                🔒 <span>© 2026 Pascal team</span> — Contenuto protetto.
                            </div>
                `;

                if (isAdmin(currentUser)) {
                    html += `<button class="delete-btn" onclick="window.deletePostAction('${post.id}')">Elimina</button>`;
                }

                html += `</div></div>`;
            });

            postsFeed.innerHTML = html;
        }

        // Funzione per copiare il testo del codice negli appunti
        window.copyCodeText = function(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const text = el.innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Codice copiato negli appunti!");
            }).catch(err => {
                alert("Impossibile copiare il codice.");
            });
        };

        window.deletePostAction = async function(postId) {
            if (!isAdmin(currentUser)) return;
            if (!confirm("Sei sicuro di voler eliminare questo progetto?")) return;

            try {
                await deleteDoc(doc(db, "coding_posts", postId));
                allPosts = allPosts.filter(p => p.id !== postId);
                renderPosts();
            } catch (err) {
                alert("Errore durante l'eliminazione: " + err.message);
            }
        };

        document.getElementById('publish-btn').addEventListener('click', async () => {
            if (!isAdmin(currentUser)) {
                alert("Non sei autorizzato a pubblicare.");
                return;
            }

            const titleVal = document.getElementById('post-title').value.trim();
            const imageVal = document.getElementById('post-image').value.trim();
            const langVal = document.getElementById('code-lang').value;
            let textVal = document.getElementById('post-text').value.trim();
            const statusEl = document.getElementById('publish-status');

            if (!titleVal || !textVal) {
                statusEl.textContent = "Inserisci almeno un titolo e il testo/codice.";
                statusEl.className = "status-msg error";
                return;
            }

            // Se l'utente ha selezionato un linguaggio dal menu a tendina, aggiungiamo automaticamente #coding [lang] in cima
            if (langVal !== 'none') {
                textVal = `#coding ${langVal}\n` + textVal;
            }

            try {
                statusEl.textContent = "Pubblicazione in corso...";
                statusEl.className = "status-msg";

                await addDoc(collection(db, "coding_posts"), {
                    title: titleVal,
                    imageUrl: imageVal,
                    text: textVal,
                    authorUid: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                document.getElementById('post-title').value = '';
                document.getElementById('post-image').value = '';
                document.getElementById('post-text').value = '';
                document.getElementById('code-lang').value = 'none';
                statusEl.textContent = "Progetto pubblicato con successo!";
                statusEl.className = "status-msg success";

                loadPosts();
            } catch (err) {
                statusEl.textContent = "Errore: " + err.message;
                statusEl.className = "status-msg error";
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
